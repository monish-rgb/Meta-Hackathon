[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgate-client"
version = "0.1.0"
description = "External HTTP client for the FlowGate agent information-flow gateway"
requires-python = ">=3.11"
dependencies = ["httpx"]

[tool.setuptools]
packages = ["flowgate_client"]
